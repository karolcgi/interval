# Builds, signs and publishes the Windows installer whenever a version tag (v*) is pushed.
# The release includes latest.json, which installed copies of Interval poll for updates.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview build: publish as a pre-release (version X.Y.Z-preview.N). Installed copies never auto-update to it."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Preview builds get a pre-release version (lower than the final X.Y.Z, so the real release still updates it).
      - name: Preview version
        if: ${{ inputs.preview }}
        shell: bash
        run: node -e "const f='package.json';const p=require('./'+f);p.version=p.version.replace(/-.*$/,'')+'-preview.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n');console.log(p.version)"
      # Pasted secrets often carry a trailing newline, which breaks the key password.
      - name: Normalise signing secrets
        shell: bash
        env:
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pw="$(printf '%s' "$RAW_PW" | tr -d '\r\n')"
          echo "::add-mask::$pw"
          echo "SIGNING_PW=$pw" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.SIGNING_PW }}
        with:
          tagName: v__VERSION__
          releaseName: Interval v__VERSION__
          releaseBody: |
            ${{ inputs.preview && '**Preview build for testing.** Not offered as an auto-update. Install it over your current version; your data is untouched.' || '' }}

            Download and run **Interval_*_x64-setup.exe** the first time.
            After that, Interval updates itself: an "Update available" card appears in the sidebar.
            Your data folder (%APPDATA%\app.interval.desktop) is never touched by installs or updates.
          releaseDraft: false
          prerelease: ${{ inputs.preview == true }}
          includeUpdaterJson: true
